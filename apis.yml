name: Topos Bio
description: 'Topos Bio is an AI-native drug discovery company building all-atom foundation
  models for intrinsically disordered proteins (IDPs) — dynamic, flexible proteins implicated
  in diseases such as Alzheimer''s and prostate cancer. Its Topos-1 foundation model generates
  physically realistic conformational ensembles for flexible proteins, aiming to make
  previously undruggable targets therapeutically viable. The company is backed by Threshold
  Ventures. No public API or developer platform is currently published.'
